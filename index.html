<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSG Aufstellung">
<meta name="theme-color" content="#8B1A10">
<title>TSG 1846 – Aufstellung</title>
<style>
:root{--red:#8B1A10;--red-dark:#6B1209;--red-light:#A52016;--cream:#F2EFE6;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

/* NAV */
.nav{display:flex;background:#0a0a0a;border-bottom:2px solid var(--red);position:sticky;top:0;z-index:10;}
.nav button{flex:1;padding:14px 8px;background:none;border:none;border-bottom:3px solid transparent;color:#777;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.nav button.active{color:#fff;border-bottom-color:var(--red);}

/* PANEL */
.panel{display:none;padding:14px;padding-bottom:40px;}
.panel.active{display:block;}

/* LABELS */
.lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#666;margin-bottom:6px;display:block;}

/* INPUTS */
input,select,textarea{width:100%;background:#1e1e1e;border:1px solid #333;border-radius:8px;color:#fff;font-size:16px;padding:11px 13px;outline:none;-webkit-appearance:none;appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--red-light);}
textarea{resize:vertical;min-height:60px;}
.row{margin-bottom:13px;}

/* ADD PLAYER */
.add-row{display:flex;gap:8px;margin-bottom:8px;}
.add-row input:first-child{width:68px;flex-shrink:0;}
.add-row input:nth-child(2){flex:1;}
.btn-add{background:var(--red);border:none;border-radius:8px;color:#fff;font-size:24px;width:46px;flex-shrink:0;cursor:pointer;}

/* PLAYER ITEMS */
.player-item{display:flex;align-items:center;background:#1e1e1e;border-radius:8px;padding:11px 13px;gap:10px;margin-bottom:6px;}
.pnum{font-size:20px;font-weight:900;color:var(--red-light);min-width:28px;text-align:right;}
.pname{flex:1;font-weight:600;font-size:15px;}
.prole{font-size:10px;color:#999;background:#2a2a2a;border-radius:4px;padding:2px 6px;}
.btn-del{background:none;border:none;color:#444;font-size:18px;cursor:pointer;padding:0 2px;}

/* GRID SELECTOR */
.section-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#666;margin:16px 0 8px;}
.badge{background:var(--red);border-radius:20px;font-size:10px;padding:1px 7px;margin-left:5px;font-weight:700;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.card{background:#1e1e1e;border:2px solid #2a2a2a;border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;}
.card.sel{background:var(--red-dark);border-color:var(--red-light);}
.card .cnum{font-size:22px;font-weight:900;color:var(--red-light);}
.card.sel .cnum{color:#ffb3aa;}
.card .cname{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.card .crole{position:absolute;top:3px;right:4px;font-size:9px;background:rgba(255,255,255,.2);border-radius:3px;padding:1px 4px;font-weight:700;}

/* HOME/AWAY */
.ha-row{display:flex;gap:8px;}
.ha-btn{flex:1;padding:11px 8px;background:#1e1e1e;border:2px solid #2a2a2a;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.ha-btn.sel{background:var(--red-dark);border-color:var(--red-light);}

/* GENERATE */
.btn-gen{width:100%;background:var(--red);border:none;border-radius:12px;color:#fff;font-size:20px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:16px;cursor:pointer;margin-top:4px;}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;overflow-y:auto;padding:16px;flex-direction:column;align-items:center;}
.modal.open{display:flex;}
.hint{color:#aaa;font-size:13px;text-align:center;margin-bottom:14px;line-height:1.5;}
.btn-close{background:#222;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;padding:13px 28px;margin-top:16px;cursor:pointer;}

/* GRAPHIC */
.gc{width:100%;max-width:400px;background:var(--red);padding:28px 20px 20px;position:relative;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;}
.gc-corners{display:flex;justify-content:space-between;position:absolute;top:14px;left:20px;right:20px;}
.gc-corners span{color:#fff;font-size:12px;}
.gc-liga{text-align:center;color:#fff;font-size:14px;font-weight:700;font-style:italic;letter-spacing:2px;text-transform:uppercase;margin-top:10px;}
.gc-title{text-align:center;color:#fff;font-size:60px;font-weight:900;line-height:.9;text-transform:uppercase;letter-spacing:-1px;margin:4px 0 10px;}
.gc-meta{text-align:center;margin-bottom:6px;}
.gc-meta-line{color:#fff;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;line-height:1.7;}
.gc-time{display:flex;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:13px;font-weight:600;margin-top:3px;}
.gc-time svg{width:13px;height:13px;}
.gc-treff{background:rgba(0,0,0,.22);border-radius:8px;padding:7px 11px;margin:8px 0;}
.gc-treff-line{display:flex;gap:6px;color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1.6;}
.gc-treff-label{color:rgba(255,255,255,.45);min-width:68px;font-size:10px;}
.gc-players-row{display:flex;align-items:center;min-height:185px;margin:12px 0 10px;}
.gc-players{flex:1;}
.gc-player{display:flex;align-items:baseline;gap:6px;color:#fff;font-size:20px;font-weight:900;text-transform:uppercase;line-height:1.3;}
.gc-player .pn{min-width:24px;text-align:right;}
.gc-player .pt{font-size:12px;color:rgba(255,255,255,.65);font-weight:700;}
.gc-emblem{width:130px;flex-shrink:0;}
.gc-emblem img{width:100%;height:auto;}
.gc-motto{background:var(--cream);border-radius:6px;padding:9px 20px;text-align:center;position:relative;}
.gc-motto::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);border:10px solid transparent;border-right-color:var(--cream);}
.gc-motto::after{content:'';position:absolute;right:-10px;top:50%;transform:translateY(-50%);border:10px solid transparent;border-left-color:var(--cream);}
.gc-motto-text{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--red);line-height:1.5;}
.gc-motto-text em{font-style:italic;color:var(--red-dark);}

.empty{text-align:center;color:#444;padding:36px 0;font-size:14px;}
</style>
</head>
<body>

<nav class="nav">
  <button class="active" onclick="showTab('kader',this)">⚽ Kader</button>
  <button onclick="showTab('spiel',this)">📋 Spiel</button>
</nav>

<!-- KADER TAB -->
<div id="tab-kader" class="panel active">
  <div class="section-title">Neuen Spieler anlegen</div>
  <div class="add-row">
    <input type="number" id="new-num" placeholder="#" min="1" max="99" inputmode="numeric">
    <input type="text" id="new-name" placeholder="Name" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-add" onclick="addPlayer()">+</button>
  </div>
  <div class="row">
    <select id="new-role">
      <option value="">– Rolle (optional) –</option>
      <option value="TW">TW – Torwart</option>
      <option value="C">C – Kapitän</option>
      <option value="ETW">ETW – Ersatztorwart</option>
    </select>
  </div>
  <div class="section-title">Kader <span class="badge" id="kader-count">0</span></div>
  <div id="player-list"></div>
</div>

<!-- SPIEL TAB -->
<div id="tab-spiel" class="panel">
  <div class="section-title">Spielinfos</div>
  <div class="row"><span class="lbl">Liga / Wettbewerb</span>
    <input type="text" id="liga" value="Kreisliga" placeholder="z.B. Kreisliga Spieltag 17"></div>
  <div class="row"><span class="lbl">Gegner</span>
    <input type="text" id="gegner" placeholder="z.B. FTG PFUNGSTADT" oninput="this.value=this.value.toUpperCase()"></div>
  <div class="row"><span class="lbl">Datum & Uhrzeit</span>
    <input type="text" id="datum" placeholder="z.B. 09.05.26, 12 Uhr"></div>
  <div class="row"><span class="lbl">Heim / Auswärts</span>
    <div class="ha-row">
      <button class="ha-btn sel" onclick="setHA('HEIMSPIEL',this)">🏠 Heim</button>
      <button class="ha-btn" onclick="setHA('AUSWÄRTSSPIEL',this)">✈️ Auswärts</button>
    </div>
  </div>
  <div class="row"><span class="lbl">Treffpunkt / Adresse (optional)</span>
    <textarea id="treffpunkt" placeholder="Treffpunkt: Sportplatz Arheilgen&#10;Adresse: Musterstr. 1, Darmstadt" rows="3"></textarea>
  </div>
  <div class="section-title">Spieler nominieren <span class="badge" id="sel-count">0</span></div>
  <div class="grid" id="selector-grid"></div>
  <button class="btn-gen" onclick="generate()">🖼️ Grafik erstellen</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <p class="hint"><strong>📸 Screenshot machen</strong><br>dann in WhatsApp teilen</p>
  <div class="gc" id="graphic"></div>
  <button class="btn-close" onclick="closeModal()">✕ Schließen</button>
</div>

function save(){
  localStorage.setItem('tsg_players',JSON.stringify(players));
  localStorage.setItem('tsg_selected',JSON.stringify([...selected]));
}

function showTab(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='spiel') renderGrid();
}

function setHA(val,btn){
  ha=val;
  document.querySelectorAll('.ha-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

function addPlayer(){
  const num=parseInt(document.getElementById('new-num').value);
  const name=document.getElementById('new-name').value.trim().toUpperCase();
  const role=document.getElementById('new-role').value;
  if(!num||!name){alert('Bitte Nummer und Name eingeben.');return;}
  if(players.find(p=>p.num===num)){alert('Nummer '+num+' bereits vergeben.');return;}
  players.push({num,name,role});
  players.sort((a,b)=>a.num-b.num);
  save();
  document.getElementById('new-num').value='';
  document.getElementById('new-name').value='';
  document.getElementById('new-role').value='';
  renderList();
}

function deletePlayer(num){
  if(!confirm('Spieler #'+num+' entfernen?'))return;
  players=players.filter(p=>p.num!==num);
  selected.delete(num);
  save();
  renderList();
  renderGrid();
}

function renderList(){
  const el=document.getElementById('player-list');
  document.getElementById('kader-count').textContent=players.length;
  if(!players.length){el.innerHTML='<div class="empty">👥<br>Noch keine Spieler angelegt.</div>';return;}
  el.innerHTML=players.map(p=>`
    <div class="player-item">
      <span class="pnum">${p.num}</span>
      <span class="pname">${p.name}</span>
      ${p.role?`<span class="prole">${p.role}</span>`:''}
      <button class="btn-del" onclick="deletePlayer(${p.num})">🗑</button>
    </div>`).join('');
}

function renderGrid(){
  const el=document.getElementById('selector-grid');
  document.getElementById('sel-count').textContent=selected.size;
  if(!players.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">Erst Spieler im Kader anlegen.</div>';return;}
  el.innerHTML=players.map(p=>{
    const s=selected.has(p.num);
    return `<div class="card${s?' sel':''}" onclick="toggleSel(${p.num})">
      ${p.role?`<span class="crole">${p.role}</span>`:''}
      <div class="cnum">${p.num}</div>
      <div class="cname">${p.name}</div>
    </div>`;
  }).join('');
}

function toggleSel(num){
  selected.has(num)?selected.delete(num):selected.add(num);
  save();
  renderGrid();
}

function generate(){
  if(!selected.size){alert('Bitte Spieler auswählen.');return;}
  const liga=document.getElementById('liga').value||'Kreisliga';
  const gegner=document.getElementById('gegner').value||'–';
  const datum=document.getElementById('datum').value||'–';
  const treff=document.getElementById('treffpunkt').value.trim();
  const nominated=players.filter(p=>selected.has(p.num));

  const treffHTML=treff?`<div class="gc-treff">${treff.split('\n').filter(Boolean).map(l=>{
    const i=l.indexOf(':');
    return i>-1?`<div class="gc-treff-line"><span class="gc-treff-label">${l.slice(0,i)}:</span><span>${l.slice(i+1).trim()}</span></div>`
    :`<div class="gc-treff-line">${l}</div>`;
  }).join('')}</div>`:'' ;

  const playersHTML=nominated.map(p=>`
    <div class="gc-player">
      <span class="pn">${p.num}</span>
      <span>${p.name}</span>
      ${p.role?`<span class="pt">(${p.role})</span>`:''}
    </div>`).join('');

  const clockSVG=`<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;

  document.getElementById('graphic').innerHTML=`
    <div class="gc-corners"><span>✦</span><span>✦</span></div>
    <div class="gc-liga">${liga}</div>
    <div class="gc-title">Aufstellung</div>
    <div class="gc-meta">
      <div class="gc-meta-line">${ha}</div>
      <div class="gc-meta-line">Gegner: ${gegner}</div>
      <div class="gc-time">${clockSVG} ${datum}</div>
    </div>
    ${treffHTML}
    <div class="gc-players-row">
      <div class="gc-players">${playersHTML}</div>
      <div class="gc-emblem"><img src="${LOGO}" alt="TSG 1846"></div>
    </div>
    <div class="gc-motto">
      <div class="gc-motto-text">" TSG Darmstadt– <em>Löwen im Spiel</em><br>Gemeinsam kämpfen– <em>Bis ans Ziel</em>"</div>
    </div>`;

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}

// Init
document.getElementById('new-name').addEventListener('keydown',e=>e.key==='Enter'&&addPlayer());
renderList();
</script>
</body>
</html>
